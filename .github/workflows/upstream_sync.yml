name: Sync with Upstream

# Polls ynput/ayon-nuke:develop for new commits.
# - If rebase of our develop onto upstream succeeds force-pushe to develop
#   from there normal package release dispatches
#   hornet_package_release.yml with the upstream version as input
# - If rebase fails → opens a PR

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git and fetch upstream
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote add upstream https://github.com/ynput/ayon-nuke.git
          git fetch upstream develop

      - name: Check for new upstream commits
        id: check
        run: |
          MERGE_BASE=$(git merge-base HEAD upstream/develop)
          UPSTREAM_SHA=$(git rev-parse upstream/develop)

          # Extract upstream version from their package.py
          UPSTREAM_VERSION=$(git show upstream/develop:package.py | grep -oP '^version = "\K[^"]+' || echo "")
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_SHA" = "$MERGE_BASE" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "develop is already up to date with upstream — nothing to do."
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Upstream version: ${UPSTREAM_VERSION}"
            echo "New upstream commits to sync:"
            git log --oneline "${MERGE_BASE}..upstream/develop"
          fi

      - name: Attempt rebase onto upstream/develop
        id: rebase
        if: steps.check.outputs.has_new == 'true'
        run: |
          if git rebase upstream/develop; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "Rebase succeeded."
          else
            # package.py and version.py always conflict because we maintain our own
            # version scheme — auto-resolve them by keeping our commit's version.
            # The release workflow will set the final correct version regardless.
            # (During rebase, --theirs = our commit being replayed, not upstream.)
            for f in package.py client/ayon_nuke/version.py; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                echo "Auto-resolving $f (keeping our version)"
                git checkout --theirs "$f"
                git add "$f"
              fi
            done

            if GIT_EDITOR=true git rebase --continue; then
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "Rebase succeeded after auto-resolving version file conflicts."
            else
              git rebase --abort
              echo "success=false" >> "$GITHUB_OUTPUT"
              echo "Rebase failed — conflicts detected."
            fi
          fi

      - name: Push rebased develop and dispatch release
        if: steps.check.outputs.has_new == 'true' && steps.rebase.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push with GITHUB_TOKEN — push events from GITHUB_TOKEN don't trigger other workflows
          # GITHUB_TOKEN is carried over from the original action env
          # so the release workflow won't double-fire from the push.
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:develop --force-with-lease

          # Dispatch the release workflow 
          gh workflow run hornet_package_release.yml \
            --ref develop \
            --field upstream_version="${{ steps.check.outputs.upstream_version }}"

      - name: Check for existing conflict PR
        id: existing_pr
        if: steps.check.outputs.has_new == 'true' && steps.rebase.outputs.success == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base develop --json title \
            --jq '.[].title' | grep -c "Upstream sync conflict" || true)
          echo "count=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Open PR for manual conflict resolution
        if: >
          steps.check.outputs.has_new == 'true' &&
          steps.rebase.outputs.success == 'false' &&
          steps.existing_pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          CONFLICT_BRANCH="upstream-sync/conflict-${TIMESTAMP}"
          UPSTREAM_LOG=$(git log --oneline "$(git merge-base HEAD upstream/develop)..upstream/develop")

          # Branch at upstream tip — PR diff will show exactly what's incoming.
          # Restore our .github/workflows/ so upstream workflow files aren't pushed
          # (GITHUB_TOKEN can't push workflow file changes without workflows permission).
          git checkout -b "$CONFLICT_BRANCH" upstream/develop
          git checkout origin/develop -- .github/workflows/
          git diff --cached --quiet || git commit -m "chore: restore hornet workflow files"
          git push origin "$CONFLICT_BRANCH"

          gh pr create \
            --title "Upstream sync conflict — manual rebase required (${TIMESTAMP})" \
            --body "$(cat <<PREOF
          ## Upstream sync failed

          Automatic rebase of \`hornet-animation/ayon-nuke:develop\` onto \`ynput/ayon-nuke:develop\` failed due to merge conflicts.

          The diff on this PR shows the incoming upstream commits. Once resolved, close this PR.

          ### New upstream commits

          \`\`\`
          ${UPSTREAM_LOG}
          \`\`\`

          ### How to resolve

          \`\`\`bash
          # Add upstream remote if you haven't already
          git remote add upstream https://github.com/ynput/ayon-nuke.git

          git fetch upstream
          git checkout develop
          git rebase upstream/develop
          # For each conflict: resolve → git add <file> → git rebase --continue
          git push origin develop --force-with-lease
          \`\`\`

          _Opened automatically by the upstream sync workflow._
          PREOF
          )" \
            --base develop \
            --head "$CONFLICT_BRANCH"

      - name: Skip duplicate conflict PR
        if: >
          steps.check.outputs.has_new == 'true' &&
          steps.rebase.outputs.success == 'false' &&
          steps.existing_pr.outputs.count != '0'
        run: |
          echo "A conflict PR is already open — skipping duplicate creation."
